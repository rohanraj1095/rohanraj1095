name: Update Profile Cards

on:
  schedule:
    - cron: "0 0 * * *" # once a day
  workflow_dispatch: {} # lets you trigger it manually

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create assets folder
        run: mkdir -p assets

      - name: Fetch stats card
        continue-on-error: true
        run: curl -sf "https://githubreadmestatsfast.vercel.app/api?username=rohanraj1095&show_icons=true&theme=tokyonight&hide_border=true" -o assets/stats.svg

      - name: Fetch top languages card
        continue-on-error: true
        run: curl -sf "https://githubreadmestatsfast.vercel.app/api/top-langs/?username=rohanraj1095&layout=compact&theme=tokyonight&hide_border=true" -o assets/top-langs.svg

      - name: Fetch activity graph
        continue-on-error: true
        run: curl -sf "https://github-readme-activity-graph.vercel.app/graph?username=rohanraj1095&theme=tokyo-night&hide_border=true" -o assets/activity-graph.svg

      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --staged --quiet || (git commit -m "Update profile cards" && git push)
